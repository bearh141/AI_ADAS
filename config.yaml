server:
  host: 0.0.0.0
  port: 8000
  grpc_port: "[::]:8500"

# ROI (Region of Interest) - Giới hạn vùng nhận diện cho từng module
# Giá trị là tỉ lệ [0.0 – 1.0] so với kích thước frame (x1, y1, x2, y2)
roi:
  lane:   [0.15, 0.50, 0.85, 1.00]   # Nửa dưới-giữa: chỉ lấy làn đường đang đi
  sign:   [0.20, 0.00, 0.80, 0.60]   # Trên-giữa: biển báo phía trước, bỏ 2 bên
  object: [0.10, 0.30, 0.90, 0.90]   # Vùng trung tâm rộng phía trước

models:
  sign:
    path: models/sign/best.pt
    conf: 0.45
    iou: 0.45
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false

  object:
    path: models/object/best.pt
    conf: 0.45
    iou: 0.5
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false

  lane:
    path: models/lane/best.pt
    conf: 0.5
    iou: 0.45
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false
